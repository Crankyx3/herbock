<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background-color: #f5f5f5;
        }
        #pdf-container {
            width: 100vw;
            height: 100vh;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            background-color: #f5f5f5;
        }
        canvas {
            display: block;
            margin-bottom: 10px;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-family: Arial, sans-serif;
            font-size: 18px;
            background: white;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .error {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff6b6b;
            font-family: Arial, sans-serif;
            font-size: 16px;
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 8px;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <div id="loading">PDF wird geladen...</div>
    <div id="pdf-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Set worker source
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Send messages to React Native
        function sendMessage(message) {
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify(message));
            }
            console.log('PDF Viewer:', message);
        }

        // Get PDF URL from query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const pdfUrl = urlParams.get('file');

        sendMessage({ type: 'init', pdfUrl });

        if (!pdfUrl) {
            const errorMsg = 'Keine PDF-Datei angegeben';
            document.getElementById('loading').innerHTML = `<div class="error">${errorMsg}</div>`;
            sendMessage({ type: 'error', message: errorMsg });
        } else {
            loadPDF(pdfUrl);
        }

        async function loadPDF(url) {
            try {
                sendMessage({ type: 'loading', url });
                const loadingTask = pdfjsLib.getDocument(url);
                const pdf = await loadingTask.promise;

                sendMessage({ type: 'loaded', numPages: pdf.numPages });
                document.getElementById('loading').style.display = 'none';

                // Render all pages
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    await renderPage(pdf, pageNum);
                    sendMessage({ type: 'page_rendered', pageNum, total: pdf.numPages });
                }

                sendMessage({ type: 'complete' });
            } catch (error) {
                console.error('Error loading PDF:', error);
                const errorMsg = `Fehler beim Laden der PDF-Datei: ${error.message}`;
                document.getElementById('loading').innerHTML =
                    `<div class="error">${errorMsg}</div>`;
                sendMessage({ type: 'error', message: error.message, stack: error.stack });
            }
        }

        async function renderPage(pdf, pageNum) {
            const page = await pdf.getPage(pageNum);

            // Calculate scale based on viewport width
            const viewport = page.getViewport({ scale: 1 });
            const scale = Math.min(window.innerWidth * 0.95 / viewport.width, 2.0);
            const scaledViewport = page.getViewport({ scale });

            // Create canvas
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = scaledViewport.height;
            canvas.width = scaledViewport.width;

            // Append to container
            document.getElementById('pdf-container').appendChild(canvas);

            // Render PDF page
            const renderContext = {
                canvasContext: context,
                viewport: scaledViewport
            };

            await page.render(renderContext).promise;
        }
    </script>
</body>
</html>
