<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herbock Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .sidebar {
            min-height: 100vh;
            background-color: #2c3e50;
            color: white;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 12px 20px;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background-color: #34495e;
            color: white;
        }
        .content {
            padding: 30px;
        }
        .card {
            border: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .stat-card {
            border-left: 4px solid #007bff;
        }
        .logo {
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-0">
                <div class="logo">
                    <i class="bi bi-building"></i> Herbock
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link active" href="#" onclick="showSection('dashboard')">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                    <a class="nav-link" href="#" onclick="showSection('projects')">
                        <i class="bi bi-folder"></i> Projekte
                    </a>
                    <a class="nav-link" href="#" onclick="showSection('users')">
                        <i class="bi bi-people"></i> Benutzer
                    </a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 content">
                <!-- Dashboard Section -->
                <div id="dashboard-section" class="section">
                    <h2 class="mb-4">Dashboard</h2>
                    <div class="row">
                        <div class="col-md-3">
                            <div class="card stat-card">
                                <div class="card-body">
                                    <h6 class="text-muted">Projekte</h6>
                                    <h3 id="stat-projects">-</h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card stat-card" style="border-left-color: #28a745;">
                                <div class="card-body">
                                    <h6 class="text-muted">Räume</h6>
                                    <h3 id="stat-rooms">-</h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card stat-card" style="border-left-color: #ffc107;">
                                <div class="card-body">
                                    <h6 class="text-muted">Offene Mängel</h6>
                                    <h3 id="stat-defects">-</h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card stat-card" style="border-left-color: #dc3545;">
                                <div class="card-body">
                                    <h6 class="text-muted">Benutzer</h6>
                                    <h3 id="stat-users">-</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Projects Section -->
                <div id="projects-section" class="section" style="display:none;">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2>Projekte</h2>
                        <button class="btn btn-primary" onclick="showProjectModal()">
                            <i class="bi bi-plus-circle"></i> Neues Projekt
                        </button>
                    </div>
                    <div id="projects-list"></div>
                </div>

                <!-- Users Section -->
                <div id="users-section" class="section" style="display:none;">
                    <h2 class="mb-4">Benutzer</h2>
                    <div id="users-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Project Modal -->
    <div class="modal fade" id="projectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Projekt erstellen</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="projectForm">
                        <div class="mb-3">
                            <label class="form-label">Projektname *</label>
                            <input type="text" class="form-control" id="project-name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Beschreibung</label>
                            <textarea class="form-control" id="project-description" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Startdatum *</label>
                            <input type="date" class="form-control" id="project-startDate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Enddatum</label>
                            <input type="date" class="form-control" id="project-endDate">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Grundriss PDF</label>
                            <input type="file" class="form-control" id="project-floorplan" accept=".pdf">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                    <button type="button" class="btn btn-primary" onclick="saveProject()">Speichern</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Room Modal -->
    <div class="modal fade" id="roomModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Raum erstellen</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="roomForm">
                        <div class="mb-3">
                            <label class="form-label">Projekt *</label>
                            <select class="form-select" id="room-projectId" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Raumname *</label>
                            <input type="text" class="form-control" id="room-name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Etage</label>
                            <input type="text" class="form-control" id="room-floor" placeholder="z.B. EG, 1. OG">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fläche (m²)</label>
                            <input type="number" class="form-control" id="room-area" step="0.1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Beschreibung</label>
                            <textarea class="form-control" id="room-description" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                    <button type="button" class="btn btn-primary" onclick="saveRoom()">Speichern</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/admin/app.js"></script>
</body>
</html>
